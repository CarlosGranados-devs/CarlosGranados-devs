<g opacity="0"><text x="36" y="140" font-size="13" fill="#7d7d85">drwxr-xr-x</text><text x="160" y="140" font-size="18" font-weight="700" fill="#ff2c2c">tarify-price-tracker/</text><text x="864" y="140" font-size="13" fill="#7d7d85" text-anchor="end">backend · api</text><text x="160" y="164" font-size="14" fill="#e6e6e6">Containerized backend that monitors e-commerce prices, keeps the price</text><text x="160" y="184" font-size="14" fill="#7d7d85">history and sends Telegram alerts when a price drops.</text><text x="160" y="206" font-size="12" fill="#ff7a7a">#python  #fastapi  #postgresql  #docker  #apscheduler</text><animate attributeName="opacity" from="0" to="1" begin="2.45s" dur="0.4s" fill="freeze"/></g>
<g opacity="0"><text x="36" y="240" font-size="13" fill="#7d7d85">drwxr-xr-x</text><text x="160" y="240" font-size="18" font-weight="700" fill="#ff2c2c">hanoi-game/</text><text x="864" y="240" font-size="13" fill="#7d7d85" text-anchor="end">university · team</text><text x="160" y="264" font-size="14" fill="#e6e6e6">Tower of Hanoi puzzle game written in Python.</text><text x="160" y="284" font-size="14" fill="#7d7d85">Move every disc from tower 1 to tower 3 without breaking the rules.</text><text x="160" y="306" font-size="12" fill="#ff7a7a">#python</text><animate attributeName="opacity" from="0" to="1" begin="2.95s" dur="0.4s" fill="freeze"/></g>
