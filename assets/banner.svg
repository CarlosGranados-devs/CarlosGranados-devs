<svg fill="none" width="860" height="260" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0a1128; rx: 10px; stroke: #1e3a8a; stroke-width: 2px; }
    .prompt { font-family: monospace; font-size: 15px; fill: #38bdf8; font-weight: bold; }
    .cmd { font-family: monospace; font-size: 15px; fill: #e2e8f0; }
    .label { font-family: monospace; font-size: 15px; fill: #38bdf8; font-weight: bold; }
    .val { font-family: monospace; font-size: 15px; fill: #e2e8f0; }
    .header { font-family: monospace; font-size: 13px; fill: #64748b; }

    .l1 { opacity: 0; animation: show 0.1s forwards 0.2s; }
    .l2 { opacity: 0; animation: show 0.1s forwards 0.6s; }
    .l3 { opacity: 0; animation: show 0.1s forwards 1.0s; }
    .l4 { opacity: 0; animation: show 0.1s forwards 1.4s; }
    .l5 { opacity: 0; animation: show 0.1s forwards 1.8s; }
    .l6 { opacity: 0; animation: show 0.1s forwards 2.2s; }

    @keyframes show {
      to { opacity: 1; }
    }

    .cursor {
      fill: #38bdf8;
      opacity: 0;
      animation: blink 0.8s infinite 2.2s;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <rect width="860" height="260" class="bg" />
  <circle cx="25" cy="20" r="6" fill="#ff5f56" />
  <circle cx="45" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="65" cy="20" r="6" fill="#27c93f" />
  <text x="430" y="24" class="header" text-anchor="middle">carlos@linux:~</text>
  <line x1="0" y1="38" x2="860" y2="38" stroke="#1e3a8a" stroke-width="1" />

  <g class="l1"><text x="35" y="75" class="prompt">carlos@linux:~$ <tspan class="cmd">whoami</tspan></text></g>
  <g class="l2"><text x="35" y="110" class="label">Subject : <tspan class="val">Carlos Granados</tspan></text></g>
  <g class="l3"><text x="35" y="140" class="label">Role    : <tspan class="val">Data Engineer Specialist & Software Eng Student</tspan></text></g>
  <g class="l4"><text x="35" y="170" class="label">Stack   : <tspan class="val">Python · SQL · PostgreSQL · Docker · TypeScript</tspan></text></g>
  <g class="l5"><text x="35" y="200" class="label">Focus   : <tspan class="val">Data Pipelines · Data Architecture · WSL2</tspan></text></g>
  <g class="l6"><text x="35" y="235" class="prompt">carlos@linux:~$ </text></g>
  <rect x="175" y="222" width="9" height="17" class="cursor" />
</svg>
