<svg fill="none" width="860" height="260" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0a1128; rx: 10px; }
    .border { stroke: #1e3a8a; stroke-width: 2px; }
    .prompt { font-family: monospace; font-size: 15px; fill: #38bdf8; font-weight: bold; }
    .cmd { font-family: monospace; font-size: 15px; fill: #e2e8f0; }
    .label { font-family: monospace; font-size: 15px; fill: #38bdf8; font-weight: bold; }
    .val { font-family: monospace; font-size: 15px; fill: #e2e8f0; }
  </style>
  
  <rect width="860" height="260" class="bg border" />
  <circle cx="25" cy="20" r="6" fill="#ff5f56" />
  <circle cx="45" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="65" cy="20" r="6" fill="#27c93f" />
  <text x="430" y="24" font-family="monospace" font-size="13" fill="#64748b" text-anchor="middle">carlos@linux:~</text>
  <line x1="0" y1="38" x2="860" y2="38" stroke="#1e3a8a" stroke-width="1" />

  <!-- Textos separados (sin etiquetas anidadas para evitar bloqueos) -->
  <text x="35" y="75" class="prompt">carlos@linux:~$ </text>
  <text x="175" y="75" class="cmd">whoami</text>

  <text x="35" y="110" class="label">Subject : </text>
  <text x="125" y="110" class="val">Carlos Granados</text>

  <text x="35" y="140" class="label">Role    : </text>
  <text x="125" y="140" class="val">Data Engineer Specialist & Software Eng Student</text>

  <text x="35" y="170" class="label">Stack   : </text>
  <text x="125" y="170" class="val">Python · SQL · PostgreSQL · Docker · TypeScript</text>

  <text x="35" y="200" class="label">Focus   : </text>
  <text x="125" y="200" class="val">Data Pipelines · Data Architecture · WSL2</text>

  <text x="35" y="235" class="prompt">carlos@linux:~$ </text>
  
  <!-- Cursor fijo (sin animacion) -->
  <rect x="175" y="222" width="9" height="17" fill="#38bdf8" />
</svg>
