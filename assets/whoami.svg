<svg fill="none" width="860" height="280" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0a1128; rx: 10px; }
    .border { stroke: #1e3a8a; stroke-width: 2px; }
    .prompt { font-family: monospace; font-size: 15px; fill: #38bdf8; font-weight: bold; }
    .cmd { font-family: monospace; font-size: 15px; fill: #e2e8f0; }
    .label { font-family: monospace; font-size: 15px; fill: #38bdf8; font-weight: bold; }
    .val { font-family: monospace; font-size: 15px; fill: #e2e8f0; }
    .header { font-family: monospace; font-size: 13px; fill: #38bdf8; }

    /* Animacion de aparicion progresiva de lineas */
    .line1 { opacity: 0; animation: fadeIn 0.1s forwards 0.3s; }
    .line2 { opacity: 0; animation: fadeIn 0.1s forwards 0.7s; }
    .line3 { opacity: 0; animation: fadeIn 0.1s forwards 1.1s; }
    .line4 { opacity: 0; animation: fadeIn 0.1s forwards 1.5s; }
    .line5 { opacity: 0; animation: fadeIn 0.1s forwards 1.9s; }
    .line6 { opacity: 0; animation: fadeIn 0.1s forwards 2.3s; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Cursor titilante */
    .cursor {
      fill: #38bdf8;
      opacity: 0;
      animation: blink 0.8s infinite 2.3s;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Ventana de Terminal -->
  <rect width="860" height="280" class="bg border" />

  <!-- Botones de control y titulo -->
  <circle cx="25" cy="22" r="6" fill="#ff5f56" />
  <circle cx="45" cy="22" r="6" fill="#ffbd2e" />
  <circle cx="65" cy="22" r="6" fill="#27c93f" />
  <text x="430" y="26" class="header" text-anchor="middle">carlos@linux:~</text>
  <line x1="0" y1="42" x2="860" y2="42" stroke="#1e3a8a" stroke-width="1" />

  <!-- Lineas de la terminal animadas -->
  <!-- Linea 1: Prompt + comando -->
  <g class="line1">
    <text x="35" y="80" class="prompt">carlos@linux:~$ <tspan class="cmd">whoami</tspan></text>
  </g>

  <!-- Linea 2: Subject -->
  <g class="line2">
    <text x="35" y="118" class="label">Subject : <tspan class="val">Carlos Granados</tspan></text>
  </g>

  <!-- Linea 3: Role -->
  <g class="line3">
    <text x="35" y="150" class="label">Role    : <tspan class="val">Data Engineer Specialist & Software Eng Student</tspan></text>
  </g>

  <!-- Linea 4: Stack -->
  <g class="line4">
    <text x="35" y="182" class="label">Stack   : <tspan class="val">Python · SQL · PostgreSQL · Docker · TypeScript</tspan></text>
  </g>

  <!-- Linea 5: Focus -->
  <g class="line5">
    <text x="35" y="214" class="label">Focus   : <tspan class="val">Data Pipelines · Data Architecture · WSL2</tspan></text>
  </g>

  <!-- Linea 6: Prompt final + Cursor titilante -->
  <g class="line6">
    <text x="35" y="252" class="prompt">carlos@linux:~$ </text>
  </g>
  <rect x="175" y="238" width="9" height="17" class="cursor" />
</svg>
