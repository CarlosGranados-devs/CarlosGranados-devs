    .tag { font-family: monospace; font-size: 12px; fill: #4cc9f0; }
  </style>
  <rect width="860" height="240" class="bg border" />
  <circle cx="25" cy="20" r="6" fill="#ff5f56" />
  <circle cx="45" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="65" cy="20" r="6" fill="#27c93f" />
  <text x="90" y="24" font-family="monospace" font-size="12" fill="#64748b">carlos@linux:~ - fastfetch</text>
  <line x1="0" y1="38" x2="860" y2="38" stroke="#1e3a8a" stroke-width="1" />

  <!-- Logo de fastfetch estelar -->
  <polygon points="110,65 145,115 110,165 75,115" stroke="#38bdf8" stroke-width="2" fill="none" />
  <polygon points="110,80 130,115 110,150 90,115" stroke="#4cc9f0" stroke-width="2" fill="none" />
  <circle cx="110" cy="115" r="5" fill="#e2e8f0" />

