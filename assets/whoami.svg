<svg fill="none" width="860" height="270" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0a1128; rx: 10px; stroke: #1e3a8a; stroke-width: 2px; }
    .header { font-family: monospace; font-size: 13px; fill: #64748b; }
    .user { font-family: monospace; font-size: 18px; fill: #38bdf8; font-weight: bold; }
    .at { font-family: monospace; font-size: 18px; fill: #e2e8f0; }
    .label { font-family: monospace; font-size: 14px; fill: #38bdf8; font-weight: bold; }
    .val { font-family: monospace; font-size: 14px; fill: #e2e8f0; }
    .logo-text { font-family: monospace; font-size: 22px; fill: #38bdf8; font-weight: bold; }
  </style>

  <rect width="860" height="270" class="bg" />
  <circle cx="25" cy="20" r="6" fill="#ff5f56" />
  <circle cx="45" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="65" cy="20" r="6" fill="#27c93f" />
  <text x="430" y="24" class="header" text-anchor="middle">carlos@linux:~ - fastfetch</text>
  <line x1="0" y1="38" x2="860" y2="38" stroke="#1e3a8a" stroke-width="1" />

  <!-- Diamante Fastfetch personalizado con inicial "C" -->
  <polygon points="120,65 170,125 120,185 70,125" stroke="#1e3a8a" stroke-width="2" fill="none" />
  <polygon points="120,80 155,125 120,170 85,125" stroke="#2b529a" stroke-width="2" fill="none" />
  <polygon points="120,95 140,125 120,155 100,125" stroke="#38bdf8" stroke-width="2" fill="none" />
  <text x="120" y="133" class="logo-text" text-anchor="middle">C</text>

  <!-- Especificaciones del sistema -->
  <text x="210" y="75" class="user">carlos <tspan class="at">@</tspan> linux</text>
  <line x1="210" y1="85" x2="600" y2="85" stroke="#1e3a8a" stroke-width="1" />

  <text x="210" y="112" class="label">OS</text><text x="320" y="112" class="val">Linux (WSL2 / Ubuntu)</text>
  <text x="210" y="135" class="label">Focus</text><text x="320" y="135" class="val">Data Engineering & Pipelines</text>
  <text x="210" y="158" class="label">Editor</text><text x="320" y="158" class="val">Visual Studio Code</text>
  <text x="210" y="181" class="label">Languages</text><text x="320" y="181" class="val">Python · SQL · TypeScript</text>
  <text x="210" y="204" class="label">Learning</text><text x="320" y="204" class="val">Data Architecture · Docker · Databases</text>
  <text x="210" y="227" class="label">Studies</text><text x="320" y="227" class="val">Software Development Engineering</text>

  <!-- Bloques de paleta de colores -->
  <rect x="210" y="242" width="22" height="12" fill="#0a1128" rx="2" />
  <rect x="236" y="242" width="22" height="12" fill="#1e3a8a" rx="2" />
  <rect x="262" y="242" width="22" height="12" fill="#2b529a" rx="2" />
  <rect x="288" y="242" width="22" height="12" fill="#38bdf8" rx="2" />
  <rect x="314" y="242" width="22" height="12" fill="#4cc9f0" rx="2" />
  <rect x="340" y="242" width="22" height="12" fill="#e2e8f0" rx="2" />
</svg>
